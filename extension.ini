# Charts: what the project and the open file are made of, drawn in a tab of their own with
# rhun's views (https://rhun.app/extensions/v1/ section 12a); with protocol 1.1 their numbers in a
# table in the bottom panel, the keyboard in a chart and the line count in the status bar.
# Written in Rust with rhun-ext.
name = charts
owner = rhun-editor
title = Charts
description = Charts in a tab: the project's lines by language, the open file's line lengths.
icon = icon.png
color = #4f7fd9
version = 0.2.0
protocol = 1
on = command
run.linux-x86_64 = bin/charts-linux-x86_64
run.macos-arm64 = bin/charts-macos-arm64
run.windows-x64 = bin/charts-windows-x64.exe

[commands]
languages = Chart Lines by Language
lengths = Chart Line Lengths of This File

# protocol 1.1: the last chart's numbers, in a table rhun keeps (a tab of the bottom panel, ctrl+j)
[views]
numbers.title = Chart Numbers
numbers.place = panel
numbers.kind = table

[subscribe]
opened = *

[needs]
documents = read
project = read
