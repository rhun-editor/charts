[package]
name = "charts"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Charts of the project and the open file, drawn in a rhun tab"
publish = false

[dependencies]
# rhun-ext 1.4.0: protocol 1.1
rhun-ext = { git = "https://github.com/rhun-editor/extension-protocol", tag = "rust-v1.4.0" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
