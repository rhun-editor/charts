[package]
name = "charts"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Charts of the project and the open file, drawn in a rhun tab"
publish = false

[dependencies]
# rhun-ext 1.4.0 (protocol 1.1) from a checkout beside this one until it is released; then
# { git = "https://github.com/rhun-editor/extension-protocol", tag = "rust-v1.4.0" }
rhun-ext = { path = "../extension-protocol/rust/rhun-ext" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
