# Tests on the three systems rhun runs on, and the headless test against the latest rhun.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rhun
        run: curl -fsSL https://github.com/vshvedov/rhun/releases/latest/download/install.sh | sh
      - name: Headless test
        run: |
          # extensions came with rhun 0.18.0 (views, completion and signature help too)
          v=$("$HOME/.local/bin/rhun" --version | sed 's/^rhun //')
          case "$v" in 0.[0-9].*|0.1[0-7].*) echo "rhun $v has no extensions: the headless test needs 0.18.0"; exit 0 ;; esac
          sh tests/run.sh "$HOME/.local/bin/rhun"
